  />
  <circle cx="64" cy="58" r="6" fill="#0EA5E9" stroke="#4F46E5" stroke-width="2.5" />

  <!-- Live token throughput pulse waveform -->
  <path
    d="M 22 96 L 37 96 L 44 83 L 53 106 L 63 79 L 73 102 L 80 91 L 86 96 L 106 96"
    stroke="url(#tm-wave-grad)"
    stroke-width="4.5"
