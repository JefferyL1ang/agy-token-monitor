<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="tm-arc-grad" x1="24" y1="78" x2="104" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="55%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="tm-wave-grad" x1="22" y1="96" x2="106" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Neutral gauge track (strictly within 14..114 margin) -->
  <path
    d="M 31.09 77 A 38 38 0 1 1 96.91 77"
    stroke="#64748B"
    stroke-opacity="0.30"
    stroke-width="8"
    stroke-linecap="round"
  />

  <!-- Active token speed arc -->
  <path
    d="M 31.09 77 A 38 38 0 1 1 99.23 43.76"
    stroke="url(#tm-arc-grad)"
    stroke-width="8"
    stroke-linecap="round"
  />

  <!-- Context usage threshold warning zone segment -->
  <path
    d="M 101.98 59.33 A 38 38 0 0 1 96.91 77"
    stroke="#F59E0B"
    stroke-width="8"
    stroke-linecap="round"
  />

  <!-- Gauge scale ticks -->
  <g stroke="#64748B" stroke-opacity="0.65" stroke-width="2.2" stroke-linecap="round">
    <line x1="41.48" y1="71" x2="38.02" y2="73" />
    <line x1="38.39" y1="53.49" x2="34.46" y2="52.79" />
    <line x1="47.29" y1="38.08" x2="44.72" y2="35.02" />
    <line x1="64" y1="32" x2="64" y2="28" />
    <line x1="80.71" y1="38.08" x2="83.28" y2="35.02" />
    <line x1="89.61" y1="53.49" x2="93.54" y2="52.79" />
    <line x1="86.52" y1="71" x2="89.98" y2="73" />
